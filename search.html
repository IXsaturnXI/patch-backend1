<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ค้นหาร้านอร่อย - TU Aroi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">TU Aroi</div>
        <nav class="nav-links">
            <a href="search.html" class="active">ค้นพบ</a>
            <a href="profile.html">บันทึกไว้</a>
            <a href="events.html">กิจกรรม</a>
            <a href="map.html">แผนที่วิทยาเขต</a>
            <a href="random.html" class="nav-random">สุ่มดวง</a>
        </nav>
        <div class="header-right">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ค้นหาร้านอร่อย...">
            </div>
            <button id="darkModeToggle" class="theme-toggle-btn" title="สลับโหมดสว่าง/มืด">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="profile.html"><i class="fa-regular fa-user icon-btn"></i></a>
            <a href="login.html" class="btn-primary-red" style="padding: 6px 14px; font-size: 13px;">เข้าสู่ระบบ</a>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>ตัวกรอง</h3>
            <p class="sub-text">ค้นหาร้านเด็ดรอบ มธ.</p>
            <div class="category-list">
                <button class="cat-btn active"><i class="fa-solid fa-map"></i> ร้านทั้งหมด</button>
                <button class="cat-btn"><i class="fa-solid fa-utensils"></i> อาหารและเครื่องดื่ม</button>
                <button class="cat-btn"><i class="fa-solid fa-book-open"></i> โซนอ่านหนังสือ</button>
                <button class="cat-btn"><i class="fa-solid fa-gamepad"></i> ศูนย์รวมเกม</button>
                <button class="cat-btn"><i class="fa-solid fa-user-graduate"></i> บริการนักศึกษา</button>
            </div>
            <hr>
            <!-- Quick Filters: self-contained so the rest of the sidebar remains unchanged. -->
            <section class="quick-filters" aria-labelledby="quick-filters-title">
                <div class="quick-filters-heading">
                    <div>
                        <p class="quick-filters-eyebrow">QUICK FILTERS</p>
                        <h4 id="quick-filters-title">ตัวกรองด่วน</h4>
                    </div>
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                </div>
                <label class="quick-filter-check"><input type="checkbox" id="filter-open"> <span>เปิดอยู่ตอนนี้</span></label>
                <label class="quick-filter-label" for="filter-distance">ระยะทางจากฉัน</label>
                <select id="filter-distance">
                    <option value="all">ทุกระยะทาง</option>
                    <option value="1">ไม่เกิน 1 กม.</option>
                    <option value="3">ไม่เกิน 3 กม.</option>
                    <option value="5">ไม่เกิน 5 กม.</option>
                </select>
                <p id="distance-filter-status" class="sub-text" aria-live="polite"></p>
                <label class="quick-filter-check"><input type="checkbox" id="filter-rating"> <span>4 ดาวขึ้นไป</span></label>
                <div class="quick-filter-divider"></div>
                <div class="price-filter-heading">
                    <span>ช่วงราคา</span>
                    <span class="price-filter-hint">เลือกได้หลายระดับ</span>
                </div>
                <div class="price-btn-group" role="group" aria-label="กรองตามช่วงราคา">
                    <button class="price-btn" type="button" data-price="$" aria-pressed="false">$</button>
                    <button class="price-btn" type="button" data-price="$$" aria-pressed="false">$$</button>
                    <button class="price-btn" type="button" data-price="$$$" aria-pressed="false">$$$</button>
                </div>
                <button class="reset-btn" type="button">ล้างตัวกรอง</button>
            </section>
        </aside>

        <main class="content">
            <div class="content-header">
                <div>
                    <h2>ค้นหาร้านอร่อย</h2>
                    <p class="subtitle" style="color: var(--text-muted); font-size: 13px;">แสดงร้านค้าและสถานที่รอบ มธ. รังสิต</p>
                </div>
                <div class="sort-dropdown">
                    <label>เรียงโดย:</label>
                    <select style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px;">
                        <option value="recommended">แนะนำ</option>
                        <option value="rating">คะแนนสูงสุด</option>
                        <option value="distance">ระยะทางใกล้ที่สุด</option>
                    </select>
                </div>
            </div>

            <!-- การ์ดร้านค้าจะถูกเรนเดอร์ลงใน div นี้โดย script.js -->
            <div class="card-grid"></div>

            <button class="load-more-btn">โหลดร้านเพิ่มเติม</button>
        </main>
    </div>

    <footer class="footer">
        <div class="footer-logo">TU Aroi</div>
        <p>© 2026 รวบรวมร้านเด็ดและสถานที่รอบมหาวิทยาลัยธรรมศาสตร์</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
